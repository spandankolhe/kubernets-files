apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myconatiner
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:   #pod path
        - name: myvolume
          mountPath: /usr/share/nginx/html/
      volumes: #worker node path
      - name: myvolume
        hostPath:
          path: /home/ubuntu/bkp
          type: DirectoryOrCreate
