apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: mycontainer
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - name: myvolume
          mountPath: /etc/nginx/conf.d
      volumes: 
      - name: myvolume
        configMap: 
          name: nginxconfig

